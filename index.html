<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talonario Pro v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;
--slate-400:#94a3b8;--slate-500:#64748b;--slate-600:#475569;--slate-650:#3b4a5f;
--slate-700:#334155;--slate-750:#2a3648;--slate-800:#1e293b;--slate-900:#0f172a;
--slate-950:#020617;
--blue-400:#60a5fa;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-800:#1e40af;--blue-950:#172554;
--emerald-400:#34d399;--emerald-500:#10b981;--emerald-600:#059669;--emerald-950:#022c22;
--orange-300:#fdba74;--orange-400:#fb923c;--orange-500:#f97316;--orange-600:#ea580c;--orange-950:#431407;
--amber-400:#fbbf24;--amber-500:#f59e0b;--amber-950:#451a03;
--rose-300:#fda4af;--rose-400:#fb7185;--rose-500:#f43f5e;--rose-600:#e11d48;--rose-800:#9f1239;--rose-900:#881337;--rose-950:#4c0519;
--yellow-400:#facc15;
--green-wa:#25D366;--green-wa-hover:#1ebe57
}
html{font-family:system-ui,-apple-system,sans-serif;background:var(--slate-900);color:var(--slate-100);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
/* Layout */
.d-flex{display:flex}
.d-grid{display:grid}
.flex-col{flex-direction:column}
.flex-wrap{flex-wrap:wrap}
.flex-1{flex:1}
.flex-shrink-0{flex-shrink:0}
.items-center{align-items:center}
.items-start{align-items:flex-start}
.items-baseline{align-items:baseline}
.justify-center{justify-content:center}
.justify-between{justify-content:space-between}
.justify-end{justify-content:flex-end}
.gap-1{gap:.25rem}.gap-1\\.5{gap:.375rem}.gap-2{gap:.5rem}.gap-2\\.5{gap:.625rem}
.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-6{gap:1.5rem}.gap-8{gap:2rem}
.space-y-2>*+*{margin-top:.5rem}
.space-y-2\\.5>*+*{margin-top:.625rem}
.space-y-3>*+*{margin-top:.75rem}
.space-y-4>*+*{margin-top:1rem}
.space-y-5>*+*{margin-top:1.25rem}
.space-y-6>*+*{margin-top:1.5rem}
/* Sizing */
.w-full{width:100%}
.w-1\\/2{width:50%}
.w-1\\/3{width:33.333%}
.w-2\\/3{width:66.666%}
.h-full{height:100%}
/* Text */
.text-center{text-align:center}
.text-right{text-align:right}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.font-sans{font-family:system-ui,-apple-system,sans-serif}
.font-mono{font-family:'SF Mono',Consolas,'Courier New',monospace}
.font-normal{font-weight:400}
.font-semibold{font-weight:600}
.font-bold{font-weight:700}
.font-extrabold{font-weight:800}
.text-\\[8px\\]{font-size:.5rem}
.text-\\[9px\\]{font-size:.5625rem}
.text-\\[10px\\]{font-size:.625rem}
.text-\\[11px\\]{font-size:.6875rem}
.text-xs{font-size:.75rem;line-height:1rem}
.text-sm{font-size:.875rem;line-height:1.25rem}
.text-base{font-size:1rem;line-height:1.5rem}
.text-lg{font-size:1.125rem;line-height:1.75rem}
.text-xl{font-size:1.25rem;line-height:1.75rem}
.text-2xl{font-size:1.5rem;line-height:2rem}
.leading-relaxed{line-height:1.625}
.tracking-tight{letter-spacing:-.025em}
.tracking-wide{letter-spacing:.025em}
.tracking-wider{letter-spacing:.05em}
.tracking-widest{letter-spacing:.1em}
.uppercase{text-transform:uppercase}
.capitalize{text-transform:capitalize}
/* Borders */
.rounded-full{border-radius:9999px}
.rounded-lg{border-radius:.5rem}
.rounded-xl{border-radius:.75rem}
.rounded-2xl{border-radius:1rem}
/* Position */
.relative{position:relative}
.absolute{position:absolute}
.fixed{position:fixed}
.sticky{position:sticky}
.inset-0{top:0;right:0;bottom:0;left:0}
.top-0{top:0}
/* Z-index */
.z-10{z-index:10}
.z-40{z-index:40}
.z-50{z-index:50}
.z-55{z-index:55}
/* Overflow */
.overflow-hidden{overflow:hidden}
.overflow-y-auto{overflow-y:auto}
/* Misc */
.cursor-pointer{cursor:pointer}
.antialiased{-webkit-font-smoothing:antialiased}
.outline-none{outline:2px solid transparent;outline-offset:2px}
.opacity-0{opacity:0}
.opacity-30{opacity:.3}
.opacity-75{opacity:.75}
/* Responsive grid helpers */
.main-layout{display:grid;grid-template-columns:1fr;gap:2rem}
@media(min-width:1024px){.main-layout{grid-template-columns:repeat(4,1fr)}}
.sidebar-col{grid-column:span 1}
.main-col{grid-column:span 3}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
@media(min-width:768px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.ticket-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.625rem}
@media(min-width:640px){.ticket-grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:768px){.ticket-grid{grid-template-columns:repeat(8,1fr)}}
@media(min-width:1024px){.ticket-grid{grid-template-columns:repeat(10,1fr)}}
.client-grid{display:grid;grid-template-columns:1fr}
@media(min-width:768px){.client-grid{grid-template-columns:repeat(3,1fr)}}
.payment-grid{display:grid;grid-template-columns:1fr}
@media(min-width:768px){.payment-grid{grid-template-columns:repeat(2,1fr)}}
.header-row{flex-direction:column}
@media(min-width:768px){.md-flex-row,.header-row{flex-direction:row}.md-w-auto{width:auto}.md-text-sm{font-size:.875rem}}
@media(min-width:1280px){.xl-w-auto,.filter-row{width:auto;flex-direction:row}}
@media(min-width:640px){.sm-flex-row,.sm\:flex-row{flex-direction:row}}
.pagination-gap{gap:.25rem}
/* Inputs */
input[type="text"],input[type="number"],input[type="email"],select,button{font-family:inherit}
input::placeholder{color:var(--slate-500)}
input:focus{box-shadow:0 0 0 2px var(--blue-500);border-color:var(--blue-500)}
button:disabled{opacity:.4;cursor:default}
/* Animations */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
/* Ticket states */
.tk-disp{background:rgba(2,44,34,0.4);border-color:rgba(16,185,129,0.4);color:var(--emerald-400)}
.tk-disp:hover{background:var(--emerald-500);color:var(--slate-900);border-color:var(--emerald-500)}
.tk-apart{background:rgba(67,20,7,0.45);border-color:rgba(249,115,22,0.6);color:var(--orange-400)}
.tk-apart:hover{background:var(--orange-500);color:var(--slate-950);border-color:var(--orange-500)}
.tk-pag{background:var(--slate-800);color:var(--slate-600);border-color:var(--slate-750)}
.tk-pag:hover{background:var(--slate-700);color:var(--slate-200);border-color:var(--slate-600)}
/* Custom */
.backdrop-blur-sm{backdrop-filter:blur(4px)}
.max-w-7xl{max-width:80rem}
.max-w-md{max-width:28rem}
.max-w-2xl{max-width:42rem}
.mx-auto{margin-left:auto;margin-right:auto}
.icon-container{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.icon-container svg{display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==== SVG ICON FACTORY ====
function icon(path, w, h) {
  const wA = w || 16;
  const hA = h || wA;
  return `<svg width="${wA}" height="${hA}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
function icnTicket(s) { return icon('<line x1="2" y1="3" x2="2" y2="21"/><line x1="22" y1="3" x2="22" y2="21"/><path d="M4 7h4M4 11h4M4 15h4M4 19h4M12 5v14M16 7l-2 5l2 5M18 7l-2 5l2 5M14 5h6v14h-6"/>', s, s); }
function icnSearch(s) { return icon('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>', s, s); }
function icnDownload(s) { return icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>', s, s); }
function icnTrash2(s) { return icon('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>', s, s); }
function icnPlus(s) { return icon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', s, s); }
function icnUser(s) { return icon('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>', s, s); }
function icnDollar(s) { return icon('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>', s, s); }
function icnSend(s) { return icon('<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>', s, s); }
function icnCheckCircle(s) { return icon('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>', s, s); }
function icnAlertCircle(s) { return icon('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', s, s); }
function icnX(s) { return icon('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', s, s); }
function icnChevronLeft(s) { return icon('<polyline points="15 18 9 12 15 6"/>', s, s); }
function icnChevronRight(s) { return icon('<polyline points="9 18 15 12 9 6"/>', s, s); }
function icnChevronsLeft(s) { return icon('<polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>', s, s); }
function icnChevronsRight(s) { return icon('<polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>', s, s); }
function icnBookmark(s) { return icon('<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>', s, s); }
function icnCreditCard(s) { return icon('<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>', s, s); }
function icnEdit(s) { return icon('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>', s, s); }
function icnRefresh(s) { return icon('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>', s, s); }

// ==== STATE ====
let rifas = [], activeRifaId = '', clientes = [];
let isVentaModalOpen = false, isNuevaRifaModalOpen = false, editingRifaId = null, selectedTicket = null;
let customConfirm = { isOpen: false, title: '', message: '', onConfirm: null, actionType: 'danger' };
let ticketSearch = '', ticketFilter = 'all', selectedClientFilterId = '', clientSearch = '', currentPage = 1;
let formRifa = { nombre: '', precio: 5, desde: 1, hasta: 100, lotteryEnabled: false, lotteryTimeSlot: '10:10', lotteryDraws: ['A'], lotteryEndDate: '', lotteryEndType: 'date' };
let formActionType = 'pagar';
let formClient = { cedula: '', nombre: '', telefono: '58', email: '' };
let formPayment = { metodo: 'efectivo', montoEfectivo: 5, montoTransferencia: 0, banco: '', referencia: '' };
let errorForm = '', successLink = '';
const TICKETS_POR_PAGINA = 200;

function defaultRifaInicial() {
  const desde = 1, hasta = 100, padLength = hasta.toString().length, tickets = [];
  for (let i = desde; i <= hasta; i++) {
    tickets.push({ numero: i.toString().padStart(padLength, '0'), estado: 'disponible', clienteId: null, transaccionId: null, montoPagado: 0 });
  }
  return { id: 'rifa-inicial-default', nombre: 'Sorteo Inicial de Bienvenida', precioTicket: 5, desde, hasta, padLength, tickets, transacciones: [] };
}

function getActive() { return rifas.find(r => r.id === activeRifaId) || rifas[0] || null; }

function getFiltered(act) {
  if (!act) return [];
  return act.tickets.filter(t => {
    const ms = t.numero.includes(ticketSearch);
    let mf = true; if (ticketFilter !== 'all') mf = t.estado === ticketFilter;
    let mc = true; if (selectedClientFilterId) mc = t.clienteId === selectedClientFilterId;
    return ms && mf && mc;
  });
}

function saveData() { if (rifas.length > 0) localStorage.setItem('multi_rifas_data_v3', JSON.stringify({ rifas, clientes, activeRifaId })); }

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem('multi_rifas_data_v3'));
    if (d) { rifas = d.rifas || []; clientes = d.clientes || []; activeRifaId = d.activeRifaId || (rifas[0]?.id || ''); return; }
  } catch(e) {}
  try {
    const d = JSON.parse(localStorage.getItem('multi_rifas_data_v2'));
    if (d) { rifas = d.rifas || []; clientes = d.clientes || []; activeRifaId = d.activeRifaId || ''; return; }
  } catch(e) {}
  const def = defaultRifaInicial();
  rifas = [def]; clientes = []; activeRifaId = def.id;
}

function esc(s) { if (typeof s !== 'string') return s; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#039;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ==== HANDLERS (attached as onclick) ====
function hExportar() { const b={rifas,clientes,activeRifaId};const u=URL.createObjectURL(new Blob([JSON.stringify(b,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='backup_multi_rifas_'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(u); }

function hResetDB() { customConfirm={isOpen:true,title:'Resetear Base de Datos?',message:'Esta acci\u00f3n borrar\u00e1 todas las rifas, los clientes y el historial local por completo. \u00a1No se puede revertir!',actionType:'danger',onConfirm:()=>{localStorage.removeItem('multi_rifas_data_v3');localStorage.removeItem('multi_rifas_data_v2');const d=defaultRifaInicial();rifas=[d];clientes=[];activeRifaId=d.id;selectedClientFilterId='';customConfirm.isOpen=false;saveData();render()}};render() }

function hBorrarRifa(id) { const r=rifas.find(x=>x.id===id);if(!r)return;customConfirm={isOpen:true,title:'Eliminar "'+r.nombre+'"?',message:'Se borrar\u00e1 permanentemente este talonario con todos sus n\u00fameros vendidos, apartados y transacciones asociadas.',actionType:'danger',onConfirm:()=>{const f=rifas.filter(x=>x.id!==id);if(f.length===0){const d=defaultRifaInicial();rifas=[d];activeRifaId=d.id}else{rifas=f;if(activeRifaId===id)activeRifaId=f[0].id}selectedClientFilterId='';customConfirm.isOpen=false;saveData();render()}};render() }

function hSelectRifa(id) { activeRifaId=id;selectedClientFilterId='';currentPage=1;saveData();render() }

function hTicketSearch(v) { ticketSearch=v;currentPage=1;render() }
function hTicketFilter(f) { ticketFilter=f;currentPage=1;render() }
function hClientFilter(id) { selectedClientFilterId=id===selectedClientFilterId?'':id;currentPage=1;render() }
function hClientSearch(v) { clientSearch=v;render() }

function totalPages() { const a=getActive();return Math.ceil(getFiltered(a).length/TICKETS_POR_PAGINA)||1; }

function hPage(n) { const tp=totalPages();currentPage=Math.max(1,Math.min(n,tp));render() }

function hOpenVenta(num) {
  const a=getActive();if(!a)return;
  const t=a.tickets.find(x=>x.numero===num);if(!t)return;
  errorForm='';successLink='';selectedTicket=JSON.parse(JSON.stringify(t));
  if(t.estado==='disponible'){formActionType='pagar';formClient={cedula:'',nombre:'',telefono:'58',email:''};formPayment={metodo:'efectivo',montoEfectivo:a.precioTicket,montoTransferencia:0,banco:'',referencia:''}}
  else{const c=clientes.find(x=>x.id===t.clienteId);formClient={cedula:c?.cedula||c?.id||'',nombre:c?.nombre||'Desconocido',telefono:c?.telefono||'58',email:c?.email||''};const p=a.precioTicket-t.montoPagado;formPayment={metodo:'efectivo',montoEfectivo:p>0?p:0,montoTransferencia:0,banco:'',referencia:''}}
  isVentaModalOpen=true;render()
}

function hCloseVenta() { isVentaModalOpen=false;selectedTicket=null;errorForm='';successLink='';render() }
function hOpenNewRifa() { editingRifaId=null;isNuevaRifaModalOpen=true;formRifa={nombre:'',precio:5,desde:1,hasta:100,lotteryEnabled:false,lotteryTimeSlot:'10:10',lotteryDraws:['A'],lotteryEndDate:'',lotteryEndType:'date'};errorForm='';render() }
function hEditRifa(id) {
  const r=rifas.find(x=>x.id===id);if(!r)return;
  editingRifaId=id;
  const lc=r.lotteryConfig;
  formRifa={
    nombre:r.nombre,precio:r.precioTicket,desde:r.desde,hasta:r.hasta,
    lotteryEnabled:!!lc,lotteryTimeSlot:lc?lc.timeSlot:'10:10',
    lotteryDraws:lc?lc.draws.map(d=>d.name):['A'],
    lotteryEndDate:lc?lc.endDate||'':'',lotteryEndType:lc?lc.endType:'date'
  };
  isNuevaRifaModalOpen=true;errorForm='';render()
}
function hCloseNewRifa() { editingRifaId=null;isNuevaRifaModalOpen=false;errorForm='';render() }
function hConfirmClose() { customConfirm.isOpen=false;render() }
function hConfirmAction() { if(customConfirm.onConfirm)customConfirm.onConfirm() }

function hCedula(v) {
  const r=v.replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  const u={...formClient,cedula:r};
  const f=clientes.find(c=>c.id===r);
  if(f){
    u.nombre=f.nombre;u.telefono=f.telefono;u.email=f.email||'';
    // Direct DOM update for auto-fill without full re-render
    document.querySelectorAll('#app input').forEach(el=>{
      if(el.placeholder==='Nombre Completo'||el.placeholder==='Ej. Juan P\u00e9rez'){el.value=f.nombre}
      if(el.placeholder==='584241234567'){el.value=f.telefono}
      if(el.placeholder==='juan@ejemplo.com'){el.value=f.email||''}
    });
  }
  formClient=u;
}
function hNombre(v) { formClient={...formClient,nombre:v} }
function hTelefono(v) { formClient={...formClient,telefono:v.replace(/\D/g,'')} }
function hEmail(v) { formClient={...formClient,email:v} }

function hMetodoPago(m) {
  const a=getActive(),maxM=selectedTicket?.estado==='disponible'?(a?.precioTicket||5):((a?.precioTicket||5)-(selectedTicket?.montoPagado||0));
  let e=0,t=0;
  if(m==='efectivo')e=maxM;if(m==='transferencia')t=maxM;if(m==='mixto'){e=maxM/2;t=maxM/2}
  formPayment={...formPayment,metodo:m,montoEfectivo:e,montoTransferencia:t};render()
}

function hPagoFld(f,v) { formPayment={...formPayment,[f]:v} }

function hSetAction(t) {
  formActionType=t;
  if(t==='pagar'){const a=getActive();formPayment={...formPayment,montoEfectivo:a?a.precioTicket:5,montoTransferencia:0}}
  else formPayment={...formPayment,montoEfectivo:0,montoTransferencia:0};
  render()
}

function hRegistrar() {
  errorForm='';const a=getActive();if(!a||!selectedTicket)return;
  const cc=formClient.cedula.toUpperCase().replace(/[^A-Z0-9]/g,'').trim();
  if(!cc){errorForm='Indica la C\u00e9dula de Identidad del cliente (Ser\u00e1 su identificador \u00fanico).';render();return}
  if(!formClient.nombre.trim()||formClient.telefono.length<10){errorForm='Completa el nombre y un n\u00famero de WhatsApp internacional v\u00e1lido (Ej: 584241234567).';render();return}
  const mE=parseFloat(formPayment.montoEfectivo)||0,mT=parseFloat(formPayment.montoTransferencia)||0,tot=mE+mT,pt=a.precioTicket;
  const isNew=selectedTicket.estado==='disponible',pend=isNew?pt:(pt-selectedTicket.montoPagado);
  if(formActionType==='pagar'&&tot<pend){errorForm='El pago ingresado ($'+tot.toFixed(2)+') es menor que el saldo pendiente ($'+pend.toFixed(2)+').';render();return}
  if(tot>pend){errorForm='El pago ingresado ($'+tot.toFixed(2)+') supera el saldo pendiente ($'+pend.toFixed(2)+').';render();return}
  if((formPayment.metodo==='transferencia'||formPayment.metodo==='mixto')&&mT>0&&(!formPayment.banco.trim()||!formPayment.referencia.trim())){errorForm='Indica el Banco Emisor y la Referencia para el control fiscal y de caja.';render();return}
  if(!a.tickets.find(t=>t.numero===selectedTicket.numero)){errorForm='Ticket no encontrado.';render();return}
  let cl=clientes.find(x=>x.id===cc);
  if(!cl){cl={id:cc,cedula:cc,nombre:formClient.nombre,telefono:formClient.telefono,email:formClient.email};clientes=[...clientes,cl]}
  else clientes=clientes.map(x=>x.id===cc?{...x,nombre:formClient.nombre,telefono:formClient.telefono,email:formClient.email}:x);
  const nMA=selectedTicket.montoPagado+tot,nEst=nMA>=pt?'pagado':'apartado',esFull=nMA>=pt;

function hCrearRifa(e) {
  e.preventDefault();const s=parseInt(formRifa.desde,10),en=parseInt(formRifa.hasta,10),pr=parseFloat(formRifa.precio)||0;
  if(!formRifa.nombre.trim()){errorForm='Indica un nombre para el talonario.';render();return}
  if(isNaN(s)||isNaN(en)){errorForm='Rangos "desde" y "hasta" inv\u00e1lidos.';render();return}
  if(s<0||en<0){errorForm='Los n\u00fameros de tickets no pueden ser negativos.';render();return}
  if(s>=en){errorForm='El n\u00famero inicial debe ser menor que el n\u00famero final.';render();return}
  if(en-s>10000){errorForm='Por l\u00edmites de rendimiento del navegador, el rango m\u00e1ximo permitido es de 10,000 n\u00fameros.';render();return}
  if(pr<=0){errorForm='El precio del ticket debe ser mayor a 0.';render();return}
  const pad=en.toString().length,gt=[];
  for(let i=s;i<=en;i++)gt.push({numero:i.toString().padStart(pad,'0'),estado:'disponible',clienteId:null,transaccionId:null,montoPagado:0});
  if(editingRifaId){
    rifas=rifas.map(r=>{
      if(r.id!==editingRifaId)return r;
      const u={...r,nombre:formRifa.nombre,precioTicket:pr};
      if(formRifa.lotteryEnabled&&formRifa.lotteryDraws.length>0){
        const draws=formRifa.lotteryDraws.map(d=>({name:d,lotteryResult:null,winnerTicket:null,winnerClientId:null,winnerClientName:null}));
        u.lotteryConfig={enabled:true,timeSlot:formRifa.lotteryTimeSlot,draws,endType:formRifa.lotteryEndType,endDate:formRifa.lotteryEndDate,winnerChecked:false};
      }else delete u.lotteryConfig;
      return u;
    });
  }else{
    const nr={id:crypto.randomUUID(),nombre:formRifa.nombre,precioTicket:pr,desde:s,hasta:en,padLength:pad,tickets:gt,transacciones:[]};
    if(formRifa.lotteryEnabled&&formRifa.lotteryDraws.length>0){
      const draws=formRifa.lotteryDraws.map(d=>({name:d,lotteryResult:null,winnerTicket:null,winnerClientId:null,winnerClientName:null}));
      nr.lotteryConfig={enabled:true,timeSlot:formRifa.lotteryTimeSlot,draws,endType:formRifa.lotteryEndType,endDate:formRifa.lotteryEndDate,winnerChecked:false};
    }
    rifas=[...rifas,nr];activeRifaId=nr.id;
  }
  editingRifaId=null;isNuevaRifaModalOpen=false;formRifa={nombre:'',precio:5,desde:1,hasta:100,lotteryEnabled:false,lotteryTimeSlot:'10:10',lotteryDraws:['A'],lotteryEndDate:'',lotteryEndType:'date'};errorForm='';saveData();render()
}

// ==== LOTTERY INTEGRATION ====
const LOTTERY_API = 'https://tripletachira.com/pruebah.php';
const CORS_PROXIES = ['https://corsproxy.io/?url=','https://api.allorigins.win/raw?url=','https://api.allorigins.win/get?url='];
const DRAW_COLORS={A:'#00ff88',B:'#ff3333',ZODI:'#60a5fa'};
const DRAW_LABELS={A:'T\u00e1chira A',B:'T\u00e1chira B',ZODI:'Zodiacal'};

function getMonday(d) {
  d=new Date(d);const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);
  return new Date(d.setDate(diff));
}
function getSunday(d) {
  const m=getMonday(d);return new Date(m.getFullYear(),m.getMonth(),m.getDate()+6);
}
function fmtDate(d) {
  const dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yy=d.getFullYear();
  return dd+'/'+mm+'/'+yy;
}
function dayName(d) {
  return ['Domingo','Lunes','Martes','Miercole','Jueves','Viernes','Sabado'][d.getDay()];
}

function parseLotteryTable(html, dateStr, timeSlot, draw) {
  const d=new DOMParser().parseFromString(html,'text/html');
  const t=d.querySelector('table');if(!t)return null;
  const r=t.querySelectorAll('tr');if(r.length<2)return null;
  const dl=dayName(new Date(dateStr)),hd=r[0].querySelectorAll('th');
  let dc=-1;for(let i=0;i<hd.length;i++){if(hd[i].textContent.replace(/\s+/g,'').startsWith(dl)){dc=i;break}}
  if(dc<0)return null;
  const tk=timeSlot+' '+draw;
  for(let i=1;i<r.length;i++){
    const th=r[i].querySelector('th');if(!th)continue;
    if(th.textContent.replace(/\s+/g,' ').trim()===tk){
      const c=r[i].querySelectorAll('td')[dc-1];if(!c)return null;
      const v=c.textContent.replace(/\s+/g,' ').trim();
      if(!v||v.startsWith('---'))return null;
      const m=v.match(/(\d{3,4})/);return m?parseInt(m[1],10):null
    }
  }
  return null;
}

function calculateWinnerNumber(lotteryNum, desde, hasta) {
  const count=hasta-desde+1;
  let offset=lotteryNum%count;
  if(offset===0)offset=count;
  return desde+offset-1;
}

function isRaffleEnded(rifa) {
  const lc=rifa.lotteryConfig;
  if(!lc||!lc.enabled)return false;
  const now=new Date();
  if(lc.endType==='date'||lc.endType==='both'){
    if(!lc.endDate)return false;
    const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    if(lc.endDate===today&&lc.timeSlot){
      const [h,m]=lc.timeSlot.split(':').map(Number);
      const drawTime=new Date();drawTime.setHours(h,m,0,0);
      if(now>=drawTime)return true;
    }
    const dayStart=new Date();dayStart.setHours(0,0,0,0);
    const end=new Date(lc.endDate+'T23:59:59');
    if(dayStart<=end)return false;
  }
  if(lc.endType==='soldout'||lc.endType==='both'){
    const sold=rifa.tickets.filter(t=>t.estado!=='disponible').length;
    if(sold<rifa.tickets.length)return false;
  }
  return true;
}

function getRefDate(rifa) {
  const lc=rifa.lotteryConfig;
  if(!lc||!lc.enabled)return new Date();
  if(lc.endType==='date'||(lc.endType==='both'&&lc.endDate)){
    const end=new Date(lc.endDate+'T23:59:59');
    const now=new Date();
    return end<now?end:now;
  }
  return new Date();
}

async function checkRaffleWinner(rifa) {
  if(!rifa.lotteryConfig||!rifa.lotteryConfig.enabled)return;
  const cfg=rifa.lotteryConfig;
  if(cfg.winnerChecked)return;
  if(!isRaffleEnded(rifa))return;
  const refDate=getRefDate(rifa);
  const mon=getMonday(refDate),sun=getSunday(refDate);
  const url=LOTTERY_API+'?bt='+fmtDate(mon)+'&bt2='+fmtDate(sun);
  try {
    let text='';
    try{text=await(await fetch(url,{mode:'cors'})).text()}catch(e){}
    if(!text||(!text.includes('\t')&&!text.includes('<table'))){
      for(const p of CORS_PROXIES){
        try{const ac=new AbortController();setTimeout(()=>ac.abort(),8000);text=await(await fetch(p+encodeURIComponent(url),{signal:ac.signal})).text();if(text&&(text.includes('\t')||text.includes('<table')))break}catch(e){}
      }
    }
    if(!text||(!text.includes('\t')&&!text.includes('<table')))return;
    const dateStr=fmtDate(refDate);
    for(const draw of cfg.draws){
      const result=parseLotteryTable(text,dateStr,cfg.timeSlot,draw.name);
      if(result===null)continue;
      const winnerNum=calculateWinnerNumber(result,rifa.desde,rifa.hasta);
      const pad=String(rifa.hasta).length;
      const winnerStr=String(winnerNum).padStart(pad,'0');
      const ticket=rifa.tickets.find(t=>t.numero===winnerStr);
      draw.lotteryResult=result;
      draw.winnerTicket=winnerStr;
      if(ticket&&ticket.estado!=='disponible'){
        const client=clientes.find(c=>c.id===ticket.clienteId);
        draw.winnerClientId=ticket.clienteId;
        draw.winnerClientName=client?client.nombre:'Desconocido';
      }
    }
    cfg.winnerChecked=true;
    saveData();render();
  }catch(e){}
}

async function checkAllLotteryWinners() {
  for(const r of rifas)await checkRaffleWinner(r);
}

function hCheckWinner(rifaId) {
  const r=rifas.find(x=>x.id===rifaId);
  if(r&&r.lotteryConfig){r.lotteryConfig.winnerChecked=false;checkRaffleWinner(r)}
}

// ==== INIT ====
loadData();
render();
if(rifas.length>0)checkAllLotteryWinners();
</script>
